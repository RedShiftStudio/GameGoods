services:
  app:
    build: { context: ., dockerfile: docker/Dockerfile }
    env_file: .env
    volumes: [".:/var/www/html", "vendor:/var/www/html/vendor", "node_modules:/var/www/html/node_modules"]
    depends_on: [db]
  web:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes: [".:/var/www/html:ro", "./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [app]
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: marketplace
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: marketplace
      MYSQL_ROOT_PASSWORD: root_local_only
    volumes: ["mysql:/var/lib/mysql"]
  vite:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports: ["5173:5173"]
    volumes: [".:/app", "node_modules:/app/node_modules"]
volumes:
  mysql:
  vendor:
  node_modules:
